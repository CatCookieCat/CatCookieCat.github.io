<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NOC-LIST MAINFRAME</title>
    <style>
        body { 
            background-color: #050505; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            perspective: 800px; 
            font-family: Courier, monospace;
            
            
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .cube { 
            width: 200px; 
            height: 200px; 
            position: relative; 
            transform-style: preserve-3d; 
            
            
            animation: spin 0.01s linear infinite; 
            filter: blur(5px);
        }
        
        .face { 
            position: absolute; 
            width: 200px; 
            height: 200px; 
            background: rgba(0, 255, 0, 0.1); 
            border: 1px solid #00ff00; 
            color: #00ff00;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 28px; 
            font-weight: bold;
            box-shadow: 0 0 15px #00ff00;
            
            
            pointer-events: none;
        }
        
        .front  { transform: translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .right  { transform: rotateY(90deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX(90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        @keyframes spin { 
            100% { transform: rotateX(360deg) rotateY(360deg); } 
        }
    </style>
</head>
<body>
    
    <div class="cube" id="mainframe">
        
    </div>

    <script>
       
        const data = [
            '\x50\x52\x4f\x43\x45\x45\x44', 
            '\x54\x4f',                     
            '\x45\x4e\x44\x50\x4f\x49\x4e\x54', 
            '\x4e\x49\x47\x48\x54',         
            '\x46\x41\x4c\x4c',             
            '\x2e\x48\x54\x4d\x4c'          
        ];
        const sides = ['front', 'back', 'right', 'left', 'top', 'bottom'];
        const core = document.getElementById('mainframe');
        
        
        data.forEach((word, index) => {
            let panel = document.createElement('div');
            panel.className = 'face ' + sides[index];
            
            word.split('').forEach(char => {
                let letter = document.createElement('span');
                letter.textContent = char;
                panel.appendChild(letter);
            });
            
            core.appendChild(panel);
        });
    </script>
</body>
</html>

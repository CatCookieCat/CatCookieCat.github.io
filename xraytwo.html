<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NOC-LIST MAINFRAME</title>
    <style>
        body { 
            background-color: #050505; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            perspective: 800px; 
            font-family: Courier, monospace;
        }
        /* The animation speed is 0.05 seconds. It spins too fast to read. */
        .cube { 
            width: 200px; 
            height: 200px; 
            position: relative; 
            transform-style: preserve-3d; 
            animation: spin 0.05s linear infinite; 
        }
        .face { 
            position: absolute; 
            width: 200px; 
            height: 200px; 
            background: rgba(0, 255, 0, 0.1); 
            border: 1px solid #00ff00; 
            color: #00ff00;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 28px; 
            font-weight: bold;
            box-shadow: 0 0 15px #00ff00;
        }
        .front  { transform: translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .right  { transform: rotateY(90deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX(90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        @keyframes spin { 
            100% { transform: rotateX(360deg) rotateY(360deg); } 
        }
    </style>
</head>
<body>
    <div class="cube">
        <div class="face front">PROCEED</div>
        <div class="face back">TO</div>
        <div class="face right">/</div>
        <div class="face left">NIGHT</div>
        <div class="face top">FALL</div>
        <div class="face bottom">.HTML</div>
    </div>
</body>
</html>
